name: ci-pr

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, edited]  # edited: re-check PR title

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv lock --check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit in the PR, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-group experiment
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t enercast:ci .
      - name: Smoke test container
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          REFRESH_API_TOKEN: ${{ secrets.REFRESH_API_TOKEN }}
        run: |
          docker run -d --name app -p 8000:8000 \
            -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD -e REFRESH_API_TOKEN enercast:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 4
          done
          curl -sf localhost:8000/health || { docker logs app; exit 1; }
          curl -sf localhost:8000/model-info
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{
            "date": "2016-05-15 19:30:00", "lights": 20,
            "T1": 22.5, "RH_1": 41.2, "T2": 21.8, "RH_2": 40.5,
            "T3": 23.1, "RH_3": 39.8, "T4": 21.4, "RH_4": 38.9,
            "T5": 20.2, "RH_5": 48.1, "T6": 14.3, "RH_6": 62.0,
            "T7": 20.8, "RH_7": 37.5, "T8": 22.0, "RH_8": 42.1,
            "T9": 20.5, "RH_9": 41.0, "To": 13.8, "Pressure": 756.4,
            "RH_out": 65.0, "Windspeed": 4.2, "Visibility": 40.0, "Tdewpoint": 7.3
          }' | jq -e '.predicted_appliances_wh | numbers'

  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required check for branch protection; add new jobs to `needs`.
  ci-pass:
    if: always()
    needs: [lockfile, actionlint, secrets-scan, lint, test, docker, pr-title]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
