services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
