[project]
name = "enercast-mlops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
experiment = [
    "dvc>=3.67.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "experiment"]

[tool.pytest.ini_options]
pythonpath = ["."]
